[project]
name = "volume-profile"
version = "0.1.0"
description = "Swing Fixed Range Volume Profile: signals, targets and stops (Python port of swing_frvp.pine)"
readme = "HOWTO.md"
requires-python = ">=3.9"
dependencies = [
    "matplotlib>=3.8",
    "yfinance>=0.2.50",
]

[project.scripts]
swing-frvp = "swing_frvp:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
only-include = ["swing_frvp.py"]
